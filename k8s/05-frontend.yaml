apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: contact-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: contact-manager-front:minikube
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          env:
            - name: SITE_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: contact-manager-config
                  key: SITE_ADDRESS
            - name: API_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: contact-manager-config
                  key: API_UPSTREAM
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: contact-manager
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
